name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.mcp }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        # Test both generations of the official MCP SDK:
        # 1.x exposes FastMCP, 2.x renamed it to MCPServer.
        mcp: ["mcp>=1.12,<2", "mcp>=2,<3"]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip install "${{ matrix.mcp }}"

      - name: Compile Python
        run: python -m compileall windows_mcp_server

      - name: Run tests (imports, 96 registered tools)
        run: python -m pytest -q tests

  vscode-extension:
    name: VS Code extension
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile
